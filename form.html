<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="WDD 131 - Dynamic Web Fundamentals by Tomás Lo Giudice">
<meta name="author" content="Tomás Lo Giudice">
<title>Product Review</title>

<link rel="stylesheet" href="CSS/form.css">

<script src="JS/products.js" defer></script>
<script src="JS/form.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

<form action="review.html" method="get">

<div class="form-group">

<label for="product">Product Name</label>

<select id="product" name="product" required>
<option value="" disabled selected>Select a Product ...</option>
</select>

</div>

<div class="form-group">

<p>Overall Rating</p>

<label>
<input type="radio" id="r1" name="rating" value="1" required>
1 Star
</label>

<label>
<input type="radio" id="r2" name="rating" value="2">
2 Stars
</label>

<label>
<input type="radio" id="r3" name="rating" value="3">
3 Stars
</label>

<label>
<input type="radio" id="r4" name="rating" value="4">
4 Stars
</label>

<label>
<input type="radio" id="r5" name="rating" value="5">
5 Stars
</label>

</div>

<div class="form-group">

<label for="installDate">Date of Installation</label>

<input
type="date"
id="installDate"
name="installDate"
required>

</div>

<div class="form-group">

<p>Useful Features (Check all that apply)</p>

<label>
<input type="checkbox"
id="durability"
name="features"
value="Durability">
Durability
</label>

<label>
<input type="checkbox"
id="ease"
name="features"
value="Ease of Use">
Ease of Use
</label>

<label>
<input type="checkbox"
id="performance"
name="features"
value="Performance">
Performance
</label>

<label>
<input type="checkbox"
id="design"
name="features"
value="Design">
Design
</label>

</div>

<div class="form-group">

<label for="review">
Written Review
</label>

<textarea
id="review"
name="review"
rows="6"></textarea>

</div>

<div class="form-group">

<label for="username">
Your Name
</label>

<input
type="text"
id="username"
name="username">

</div>

<input
type="submit"
value="Post Review"
class="submit-btn">

</form>

</main>

<footer>

<p>©2026 Tomas Lo Giudice</p>

</footer>

</body>
</html>
